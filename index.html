<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>World Clock - Chelsea Peterdy</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <select>
        <option value="">Choose a city...</option>
        <option value="">London</option>
        <option value="">Sydney</option>
        <option value="">Vancouver</option>
      </select>

      <div class="city">
        <h2>Los Angeles 🇺🇸</h2>
        <div class="date">September 6, 2026</div>
        <div class="time">2:03:45PM</div>
      </div>
      <div class="city">
        <h2>Paris 🇫🇷</h2>
        <div class="date">September 6, 2026</div>
        <div class="time">2:03:45PM</div>
      </div>
    </div>
    <footer>
      This project was coded by Chelsea Peterdy and is
      <a href="https://github.com/cpeterdy/world-clock" target="_blank"
        >open sourced on GitHub</a
      >
    </footer>
    <script src="javascript/index.js"></script>
  </body>
</html>
